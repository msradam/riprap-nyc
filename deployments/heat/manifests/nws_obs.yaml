id: nws_obs
type: live
title: NWS hourly METAR observations (current temperature)
stone: touchstone
adapter: python_call

spatial:
  scope: point
  crs: EPSG:4326

# Reuses the same NWS observation probe Riprap-flood uses, just
# re-framed for the heat deployment. The probe returns hourly METAR
# including temperature_c, dewpoint_c, relative_humidity, etc. —
# heat-relevant fields the templated reconciler narrates.
config:
  module: app.context.nws_obs
  function: summary_for_point
  args:
    - {source: lat}
    - {source: lon}
  on_none: passthrough

trace_summary:
  station: station_id
  t1h_c: temperature_c

provenance:
  source_name: National Weather Service (NOAA) — nearest METAR station
  source_url: https://api.weather.gov/
  license: U.S. Public Domain
  doc_id: nws_obs
  citation: NWS hourly METAR observations, nearest station to address.

narration:
  short: Most recent NWS hourly observation at the nearest METAR station — temperature, humidity, and dewpoint.

display:
  order: 20
  kind: text
  map_layer: false
  icon: "🌤️"

fallback:
  on_offline: skip
  message: NWS api.weather.gov unreachable.
