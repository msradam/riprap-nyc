<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Riprap — Cover Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:      #F4F6F9;
    --paper-deep: #E8ECF2;
    --ink:        #0F172A;
    --ink-2:      #334155;
    --ink-3:      #64748B;
    --rule-soft:  #CBD5E1;
    --accent:     #005EA2;
    --font-sans:  "IBM Plex Sans", system-ui, sans-serif;
    --font-mono:  "IBM Plex Mono", monospace;
    --font-serif: "IBM Plex Serif", Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--paper);
    font-family: var(--font-sans);
    color: var(--ink);
  }

  .cover {
    width: 1920px;
    height: 1080px;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 72px 120px;
    position: relative;
  }

  /* top eyebrow bar */
  .eyebrow {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* screenshot frame */
  .screenshot-frame {
    border: 3px solid var(--accent);
    width: 1360px;
    height: 680px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .screenshot-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
  }

  /* headline block below screenshot */
  .headline-block {
    margin-top: 36px;
    text-align: center;
  }

  .headline {
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .subhead {
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 26px;
    line-height: 1.35;
    color: var(--ink-2);
  }

  /* bottom-left */
  .bottom-left {
    position: absolute;
    bottom: 40px;
    left: 80px;
    font-family: var(--font-mono);
    font-size: 16px;
    letter-spacing: 0.04em;
    color: var(--ink-3);
  }

  /* bottom-right dam mark + wordmark */
  .bottom-right {
    position: absolute;
    bottom: 36px;
    right: 80px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bottom-right img {
    width: 48px;
    height: 48px;
    display: block;
  }

  .wordmark {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
  }

  /* horizontal rule separating bottom strip */
  .cover::after {
    content: "";
    position: absolute;
    bottom: 96px;
    left: 80px;
    right: 80px;
    height: 1px;
    background: var(--rule-soft);
  }
</style>
</head>
<body>
<div class="cover">
  <div class="eyebrow">AMD &times; LABLAB.AI &nbsp;&middot;&nbsp; DEVELOPER HACKATHON &nbsp;&middot;&nbsp; 2026</div>

  <div class="screenshot-frame">
    <img src="../assets/screenshots/hero.png" alt="Riprap flood-exposure briefing" />
  </div>

  <div class="headline-block">
    <div class="headline">Flood risk analysis for any NYC address.</div>
    <div class="subhead">Powered by a multi-agent AI system that reads satellites, watches sensors, forecasts surges, and refuses to stay silent.</div>
  </div>

  <div class="bottom-left">github.com/msradam/riprap-nyc</div>
  <div class="bottom-right">
    <img src="logo.svg" alt="Riprap dam mark" />
    <span class="wordmark">Riprap</span>
  </div>
</div>
</body>
</html>
